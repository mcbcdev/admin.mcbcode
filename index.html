<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0c0c">
  <title>mcbcode admin</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --surface: #161616;
      --surface-2: #1e1e1e;
      --border: #2c2c2c;
      --text: #eeeeee;
      --muted: #8f8f8f;
      --accent: #05ee93;
      --danger: #fb045d;
      --r-s: 8px;
      --r-m: 12px;
      --r-l: 18px;
      --r-xl: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button { font: inherit; color: inherit; cursor: pointer; }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .wrap { width: min(100% - 32px, 1100px); margin: 0 auto; padding: 20px 0 60px; }

    /* top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .brand { font-size: 20px; font-weight: 700; }
    .brand span { color: var(--accent); }
    .who { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }

    .btn {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--r-s); padding: 8px 14px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: #0c0c0c; border-color: var(--accent); font-weight: 600; }

    /* message screens (loading / sign in / forbidden) */
    .message {
      max-width: 460px; margin: 80px auto; padding: 28px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-xl); text-align: center;
    }
    .message h1 { margin: 0 0 8px; font-size: 20px; }
    .message p { margin: 0 0 18px; color: var(--muted); }

    /* range picker */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .segmented {
      display: inline-flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-m); padding: 4px; gap: 4px; flex-wrap: wrap;
    }
    .segmented button {
      background: transparent; border: 0; border-radius: var(--r-s);
      padding: 7px 14px; color: var(--muted);
    }
    .segmented button:hover { color: var(--text); }
    .segmented button[aria-pressed="true"] { background: var(--accent); color: #0c0c0c; font-weight: 600; }

    /* stat cards */
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
    .stat {
      text-align: left; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-l); padding: 18px 20px;
    }
    .stat:hover { border-color: var(--accent); }
    .stat[aria-pressed="true"] { border-color: var(--accent); }
    .stat .label { color: var(--muted); font-size: 13px; }
    .stat .value { font-size: 34px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
    .stat .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }

    /* list header */
    .list-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .list-head h2 { margin: 0; font-size: 17px; }

    /* record cards */
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
    .row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-m); padding: 14px 16px; min-width: 0;
    }
    .row .title { font-weight: 600; overflow-wrap: anywhere; }
    .row .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .row .meta {
      display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
      margin-top: 10px; font-size: 12px;
    }
    .row .meta dt { color: var(--muted); }
    .row .meta dd { margin: 0; overflow-wrap: anywhere; }
    .tag {
      display: inline-block; font-size: 11px; padding: 1px 8px; margin-left: 6px;
      border-radius: 999px; border: 1px solid var(--accent); color: var(--accent);
      vertical-align: middle;
    }

    .status { text-align: center; color: var(--muted); padding: 24px 0; font-size: 13px; }
    .status.error { color: var(--danger); }
    #sentinel { height: 1px; }

    @media (max-width: 560px) {
      .stat .value { font-size: 28px; }
      .stat { padding: 14px 16px; }
      .list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- loading / sign in / not allowed screens -->
    <div id="screenLoading" class="message">
      <p>checking access...</p>
    </div>

    <div id="screenSignin" class="message" hidden>
      <h1>admin sign in</h1>
      <p>sign in with an admin account to continue.</p>
      <button class="btn primary" id="signinBtn">sign in</button>
    </div>

    <div id="screenForbidden" class="message" hidden>
      <h1>no access</h1>
      <p>this account is not on the admin list.</p>
      <button class="btn" id="logoutBtn2">sign out</button>
    </div>

    <div id="screenError" class="message" hidden>
      <h1>could not reach the server</h1>
      <p id="errorText">something went wrong. try again.</p>
      <button class="btn primary" id="retryBtn">try again</button>
    </div>

    <!-- the dashboard (only shown after the SERVER says you are an admin) -->
    <main id="dashboard" hidden>
      <header class="topbar">
        <div class="brand">mcb<span>code</span> admin</div>
        <div class="who">
          <span id="adminEmail"></span>
          <button class="btn" id="logoutBtn">sign out</button>
        </div>
      </header>

      <div class="toolbar">
        <div class="segmented" id="rangePicker" role="group" aria-label="time period">
          <button type="button" data-hours="24" aria-pressed="true">24 hours</button>
          <button type="button" data-hours="48" aria-pressed="false">48 hours</button>
          <button type="button" data-hours="168" aria-pressed="false">1 week</button>
          <button type="button" data-hours="720" aria-pressed="false">30 days</button>
        </div>
        <div class="toolbar-right">
          <div class="segmented" id="modePicker" role="group" aria-label="table">
            <button type="button" data-mode="users" aria-pressed="true">all users</button>
            <button type="button" data-mode="projects" aria-pressed="false">projects</button>
          </div>
          <button class="btn" id="refreshBtn">refresh</button>
        </div>
      </div>

      <section class="stats" aria-label="stats">
        <button class="stat" id="statNew" type="button" data-pick="new" aria-pressed="false">
          <div class="label" id="labelNew">new users</div>
          <div class="value" id="newUsersValue">-</div>
          <div class="hint">tap to list them</div>
        </button>
        <button class="stat" id="statActive" type="button" data-pick="second" aria-pressed="false">
          <div class="label" id="labelSecond">users who logged in</div>
          <div class="value" id="loggedInValue">-</div>
          <div class="hint">tap to list them</div>
        </button>
      </section>

      <div class="list-head">
        <h2 id="listTitle">all users</h2>
      </div>

      <div class="list" id="list"></div>
      <div class="status" id="listStatus"></div>
      <div id="sentinel"></div>
    </main>
  </div>

  <script>
    (function () {
      var API = "https://auth.mcbcode.com";

      // ---- small helpers ----
      function $(id) { return document.getElementById(id); }

      function showOnly(id) {
        ["screenLoading", "screenSignin", "screenForbidden", "screenError", "dashboard"].forEach(function (s) {
          $(s).hidden = (s !== id);
        });
      }

      // builds elements with textContent only, so database text can never run as html
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }

      function api(path) {
        return fetch(API + path, { credentials: "include" });
      }

      // d1 times are UTC strings like "2026-11-09 14:30:00"
      function parseUtc(str) {
        if (!str) return null;
        var d = new Date(str.replace(" ", "T") + "Z");
        return isNaN(d.getTime()) ? null : d;
      }

      function timeAgo(str) {
        var d = parseUtc(str);
        if (!d) return "never";
        var secs = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
        if (secs < 60) return "just now";
        var mins = Math.floor(secs / 60);
        if (mins < 60) return mins + " min ago";
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + " hr ago";
        var days = Math.floor(hrs / 24);
        if (days < 60) return days + " days ago";
        return Math.floor(days / 30) + " months ago";
      }

      function fullDate(str) {
        var d = parseUtc(str);
        return d ? d.toLocaleString() : "never";
      }

      // ---- state ----
      var hours = 24;
      var mode = "users";        // users | projects
      var view = "all";          // all | new | second  (second = logged in for users, edited for projects)
      var nextCursor = null;
      var hasMore = false;
      var loading = false;
      var generation = 0;        // bumps when the list resets, so old responses get ignored

      var titles = {
        users: { all: "all users", "new": "new users", second: "users who logged in" },
        projects: { all: "all projects", "new": "new projects", second: "projects that were edited" }
      };

      // what the server calls each view
      function serverView() {
        if (view === "second") return mode === "users" ? "active" : "edited";
        return view;
      }

      function updateLabels() {
        $("labelNew").textContent = mode === "users" ? "new users" : "new projects";
        $("labelSecond").textContent = mode === "users" ? "users who logged in" : "projects that were edited";
      }

      // ---- sign in / access check ----
      function checkAccess() {
        showOnly("screenLoading");
        api("/admin/me").then(function (res) {
          if (res.status === 401) { showOnly("screenSignin"); return null; }
          if (res.status === 403) { showOnly("screenForbidden"); return null; }
          if (!res.ok) throw new Error("server said " + res.status);
          return res.json();
        }).then(function (data) {
          if (!data) return;
          $("adminEmail").textContent = data.email;
          showOnly("dashboard");
          loadStats();
          resetList();
        }).catch(function (err) {
          $("errorText").textContent = err.message || "something went wrong. try again.";
          showOnly("screenError");
        });
      }

      function logout() {
        fetch(API + "/logout", { method: "POST", credentials: "include" })
          .then(function () { location.reload(); })
          .catch(function () { location.reload(); });
      }

      $("signinBtn").addEventListener("click", function () {
        location.href = "https://mcbcode.com/account?redirectto=" + encodeURIComponent(location.href);
      });
      $("logoutBtn").addEventListener("click", logout);
      $("logoutBtn2").addEventListener("click", logout);
      $("retryBtn").addEventListener("click", checkAccess);

      // ---- stats ----
      function loadStats() {
        $("newUsersValue").textContent = "...";
        $("loggedInValue").textContent = "...";
        var requestedHours = hours;
        var requestedMode = mode;
        api("/admin/stats?hours=" + requestedHours + "&scope=" + requestedMode).then(function (res) {
          if (!res.ok) throw new Error("stats failed");
          return res.json();
        }).then(function (data) {
          if (requestedHours !== hours || requestedMode !== mode) return; // user already picked something else
          var a = requestedMode === "users" ? data.new_users : data.new_projects;
          var b = requestedMode === "users" ? data.logged_in_users : data.edited_projects;
          $("newUsersValue").textContent = Number(a).toLocaleString();
          $("loggedInValue").textContent = Number(b).toLocaleString();
        }).catch(function () {
          $("newUsersValue").textContent = "?";
          $("loggedInValue").textContent = "?";
        });
      }

      // ---- list rendering ----
      function addMeta(dl, label, value) {
        dl.appendChild(el("dt", "", label));
        dl.appendChild(el("dd", "", value));
      }

      function renderUser(u) {
        var row = el("div", "row");
        var title = el("div", "title", u.username || "(no username)");
        if (u.rank) title.appendChild(el("span", "tag", u.rank));
        if (u.subscription_tier) title.appendChild(el("span", "tag", u.subscription_tier));
        row.appendChild(title);
        row.appendChild(el("div", "sub", u.email || ""));

        var dl = el("dl", "meta");
        addMeta(dl, "id", String(u.id));
        addMeta(dl, "joined", fullDate(u.created_at) + " (" + timeAgo(u.created_at) + ")");
        addMeta(dl, "last login", u.last_login_at ? fullDate(u.last_login_at) + " (" + timeAgo(u.last_login_at) + ")" : "never");
        addMeta(dl, "points", String(u.points || 0));
        row.appendChild(dl);
        return row;
      }

      function renderProject(p) {
        var row = el("div", "row");
        var title = el("div", "title", p.name || "(untitled)");
        title.appendChild(el("span", "tag", p.project_type || "addon"));
        row.appendChild(title);
        row.appendChild(el("div", "sub", "by " + (p.owner_username || "unknown")));

        var dl = el("dl", "meta");
        addMeta(dl, "id", String(p.id));
        addMeta(dl, "code", p.share_code || "");
        addMeta(dl, "visibility", p.is_public ? "public" : "private");
        addMeta(dl, "created", fullDate(p.created_at) + " (" + timeAgo(p.created_at) + ")");
        addMeta(dl, "updated", timeAgo(p.updated_at));
        row.appendChild(dl);
        return row;
      }

      function setStatus(text, isError) {
        var s = $("listStatus");
        s.textContent = text;
        s.className = "status" + (isError ? " error" : "");
      }

      function resetList() {
        generation++;
        nextCursor = null;
        hasMore = true;
        loading = false;
        $("list").textContent = "";
        $("listTitle").textContent = titles[mode][view] + (view !== "all" ? " (last " + rangeLabel() + ")" : "");
        setStatus("loading...");
        loadMore();
      }

      function rangeLabel() {
        if (hours === 24) return "24 hours";
        if (hours === 48) return "48 hours";
        if (hours === 168) return "week";
        return "30 days";
      }

      function listUrl() {
        var path = mode === "projects" ? "/admin/projects" : "/admin/users";
        var params = ["view=" + serverView(), "hours=" + hours, "limit=25"];
        if (nextCursor) params.push("cursor=" + encodeURIComponent(nextCursor));
        return path + "?" + params.join("&");
      }

      // loads ONE small batch (25 rows). the scroll watcher calls this again when needed.
      function loadMore() {
        if (loading || !hasMore) return;
        loading = true;
        var myGeneration = generation;
        var myMode = mode;
        setStatus("loading...");

        api(listUrl()).then(function (res) {
          if (res.status === 401 || res.status === 403) { location.reload(); return null; }
          if (!res.ok) throw new Error("server said " + res.status);
          return res.json();
        }).then(function (data) {
          if (!data) return;
          if (myGeneration !== generation) return; // list was reset while we waited
          var list = $("list");
          data.rows.forEach(function (r) {
            list.appendChild(myMode === "projects" ? renderProject(r) : renderUser(r));
          });
          nextCursor = data.next_cursor;
          hasMore = !!data.has_more;
          loading = false;
          if (hasMore) {
            setStatus("");
            // if the screen still is not full, keep loading
            requestAnimationFrame(checkSentinel);
          } else {
            setStatus(list.children.length ? "that is everything" : "nothing here for this period");
          }
        }).catch(function (err) {
          if (myGeneration !== generation) return;
          loading = false;
          setStatus("could not load more (" + err.message + "). scroll again to retry.", true);
        });
      }

      // ---- infinite scroll ----
      function checkSentinel() {
        var rect = $("sentinel").getBoundingClientRect();
        if (rect.top < window.innerHeight + 300) loadMore();
      }

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) loadMore();
        }, { rootMargin: "300px" }).observe($("sentinel"));
      } else {
        window.addEventListener("scroll", checkSentinel);
      }

      // ---- buttons ----
      function setPressed(container, attr, value) {
        var buttons = container.querySelectorAll("[" + attr + "]");
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].setAttribute("aria-pressed", String(buttons[i].getAttribute(attr) === String(value)));
        }
      }

      function syncButtons() {
        setPressed($("modePicker"), "data-mode", mode);
        $("statNew").setAttribute("aria-pressed", String(view === "new"));
        $("statActive").setAttribute("aria-pressed", String(view === "second"));
        updateLabels();
      }

      function switchView(newView) {
        // tapping the active stat card again goes back to the full list
        if (newView === view && newView !== "all") newView = "all";
        if (newView === view) return;
        view = newView;
        syncButtons();
        resetList();
      }

      function switchMode(newMode) {
        if (newMode === mode) return;
        mode = newMode;
        view = "all";
        syncButtons();
        loadStats();
        resetList();
      }

      $("rangePicker").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-hours]");
        if (!btn) return;
        var h = parseInt(btn.getAttribute("data-hours"), 10);
        if (h === hours) return;
        hours = h;
        setPressed($("rangePicker"), "data-hours", hours);
        loadStats();
        if (view !== "all") resetList();
      });

      $("modePicker").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-mode]");
        if (btn) switchMode(btn.getAttribute("data-mode"));
      });

      $("statNew").addEventListener("click", function () { switchView("new"); });
      $("statActive").addEventListener("click", function () { switchView("second"); });

      $("refreshBtn").addEventListener("click", function () {
        loadStats();
        resetList();
      });

      checkAccess();
    })();
  </script>
</body>
</html>
